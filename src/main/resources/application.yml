spring:
  application:
    name: yu-ai-agent
  profiles:
    active: local

server:
  port: 8123
  servlet:
    context-path: /api

cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  bucket: ${COS_BUCKET:}
  region: ${COS_REGION:ap-guangzhou}
  url-expire-minutes: 60
  path-prefix: agent-files
